name: Render Dock 1.0.2 UTM prerelease

on:
  push:
    branches:
      - feat/agent-notification-inbox
  workflow_dispatch:

permissions:
  contents: write

jobs:
  package:
    runs-on: windows-latest
    steps:
      - name: Check out exact source
        uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}

      - name: Set up .NET 10
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - name: Prepare pinned BKE SDK capabilities
        shell: pwsh
        run: .\scripts\bootstrap-bke-sdk.ps1

      - name: Verify notification-capable 1.0.2 source contract
        shell: pwsh
        run: |
          $project = Get-Content 'BKE_RENDER_DOCK/RENDER DOCK.csproj' -Raw
          $program = Get-Content 'BKE_RENDER_DOCK/Program.cs' -Raw
          $notifications = Get-Content 'BKE_RENDER_DOCK/Notifications/NotificationCoordinator.cs' -Raw
          $tray = Get-Content 'BKE_RENDER_DOCK/Notifications/NotificationTrayController.cs' -Raw
          $bootstrap = Get-Content 'scripts/bootstrap-bke-sdk.ps1' -Raw
          $payload = Get-Content 'packaging/windows/build-updater-payload.ps1' -Raw
          if ($project -notmatch '<Version>1\.0\.2</Version>') { throw 'Render Dock version is not 1.0.2.' }
          if ($project -notmatch 'PackageReference Include="BKE\.Notifications" Version="0\.5\.0"') { throw 'BKE.Notifications 0.5.0 reference missing.' }
          if (-not $bootstrap.Contains('82a0dc7540b1b599c027995efe79f05aa5e7c010')) { throw 'Notification SDK pin is not the provider-owned cadence head.' }
          if ($notifications -notmatch 'BkeNotificationInboxClient\.Create') { throw 'Notification inbox client missing.' }
          if ($notifications -notmatch 'InstallationIdentity\.GetOrCreate') { throw 'Notification inbox is not installation-bound.' }
          if ($notifications -match 'HttpClient|127\.0\.0\.1:43873|/v1/notifications/') { throw 'Raw notification provider protocol leaked into Render Dock.' }
          if ($tray -notmatch 'BkeNotificationInboxClient\.Create' -or $tray -notmatch 'GetUnreadCountAsync' -or $tray -notmatch 'MarkReadAsync' -or $tray -notmatch 'DismissAsync') { throw 'Notification tray lifecycle contract is incomplete.' }
          if ($tray -match 'HttpClient|127\.0\.0\.1:43873|/v1/notifications/') { throw 'Raw notification provider protocol leaked into Render Dock tray.' }
          if ($program -notmatch 'NotificationCoordinator\.Attach\(mainForm, enterpriseSession\)') { throw 'Notification coordinator is not composed.' }
          if ($program -notmatch 'NotificationTrayController\.Attach\(mainForm, enterpriseSession\)') { throw 'Notification tray is not composed.' }
          if ($payload -notmatch 'Resolve-Path -LiteralPath \$PublishDirectory') { throw 'Updater payload root normalization fix missing.' }
          if ($payload -notmatch 'Updater payload is missing exact root entry point') { throw 'Updater root-entry verification fix missing.' }

      - name: Test package contracts
        run: dotnet test "RenderDock.Tests/RenderDock.Tests.csproj" --configuration Release

      - name: Publish self-contained Windows x64 application
        shell: pwsh
        run: .\packaging\windows\publish.ps1

      - name: Verify SDK restore graph
        shell: pwsh
        run: |
          $assets = Get-Content 'BKE_RENDER_DOCK/obj/project.assets.json' -Raw
          if ($assets -notmatch 'BKE\.Desktop\.Licensing/2\.0\.0') { throw 'BKE.Desktop.Licensing 2.0.0 missing from restore graph.' }
          if ($assets -notmatch 'BKE\.Notifications/0\.5\.0') { throw 'BKE.Notifications 0.5.0 missing from restore graph.' }
          if ($assets -notmatch 'BKE\.Updater/0\.4\.0') { throw 'BKE.Updater 0.4.0 missing from restore graph.' }

      - name: Build verified updater payload
        shell: pwsh
        run: .\packaging\windows\build-updater-payload.ps1 -PublishDirectory '.\artifacts\publish\win-x64' -OutputDirectory '.\artifacts\installer'

      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup --no-progress --yes

      - name: Compile Windows installer
        shell: pwsh
        run: '& "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" "packaging/windows/render-dock.iss"'

      - name: Verify and hash release artifacts
        shell: pwsh
        run: |
          $files = @(
            'artifacts/installer/Render-Dock-1.0.2-Windows-x64.exe',
            'artifacts/installer/Render-Dock-1.0.2-Windows-x64.update.zip',
            'artifacts/installer/Render-Dock-1.0.2-Windows-x64.update.json'
          )
          foreach ($file in $files) {
            if (-not (Test-Path -LiteralPath $file -PathType Leaf)) { throw "Missing release artifact: $file" }
          }
          $metadata = Get-Content 'artifacts/installer/Render-Dock-1.0.2-Windows-x64.update.json' -Raw | ConvertFrom-Json
          if ($metadata.schema -ne 'bke.update-package.v1' -or
              $metadata.productId -ne 'bke-render-dock' -or
              $metadata.version -ne '1.0.2' -or
              $metadata.entryPoint -ne 'RENDER DOCK.exe') {
            throw 'Updater metadata contract invalid.'
          }
          $payloadHash = (Get-FileHash 'artifacts/installer/Render-Dock-1.0.2-Windows-x64.update.zip' -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($metadata.sha256 -ne $payloadHash) { throw 'Updater metadata hash mismatch.' }
          $lines = foreach ($file in $files) {
            $hash = (Get-FileHash -LiteralPath $file -Algorithm SHA256).Hash.ToLowerInvariant()
            "$hash  $(Split-Path -Leaf $file)"
          }
          $lines | Set-Content 'artifacts/installer/SHA256SUMS'
          "repository=${{ github.repository }}" | Set-Content 'artifacts/installer/SOURCE.txt'
          "ref=${{ github.ref_name }}" | Add-Content 'artifacts/installer/SOURCE.txt'
          "sha=${{ github.sha }}" | Add-Content 'artifacts/installer/SOURCE.txt'
          $lines | ForEach-Object { $_ >> $env:GITHUB_STEP_SUMMARY }

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v7
        with:
          name: Render-Dock-1.0.2-UTM
          path: |
            artifacts/installer/Render-Dock-1.0.2-Windows-x64.exe
            artifacts/installer/Render-Dock-1.0.2-Windows-x64.update.zip
            artifacts/installer/Render-Dock-1.0.2-Windows-x64.update.json
            artifacts/installer/SHA256SUMS
            artifacts/installer/SOURCE.txt
          if-no-files-found: error

      - name: Publish replaceable UTM prerelease
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = 'v1.0.2-utm-test'
          $repo = '${{ github.repository }}'
          gh release view $tag --repo $repo *> $null
          if ($LASTEXITCODE -eq 0) {
            gh release delete $tag --repo $repo --yes --cleanup-tag
            if ($LASTEXITCODE -ne 0) { throw 'Failed to remove previous UTM prerelease.' }
          }
          $notes = Join-Path $env:RUNNER_TEMP 'render-dock-utm-notes.md'
          @'
          Render Dock 1.0.2 UTM Test

          Disposable prerelease for UTM validation of the notification-capable Render Dock 1.0.2 candidate.

          Includes the Agent-backed startup notification flow and in-application notification tray through BKE.Notifications 0.5.0, plus the updater ZIP-root normalization/verification fix from the still-unmerged updater payload work.

          This is not the final stable v1.0.2 release.
          '@ | Set-Content $notes
          gh release create $tag `
            --repo $repo `
            --target $env:GITHUB_SHA `
            --title 'Render Dock 1.0.2 UTM Test' `
            --notes-file $notes `
            --prerelease `
            'artifacts/installer/Render-Dock-1.0.2-Windows-x64.exe' `
            'artifacts/installer/Render-Dock-1.0.2-Windows-x64.update.zip' `
            'artifacts/installer/Render-Dock-1.0.2-Windows-x64.update.json' `
            'artifacts/installer/SHA256SUMS' `
            'artifacts/installer/SOURCE.txt'
          if ($LASTEXITCODE -ne 0) { throw 'UTM prerelease publication failed.' }
