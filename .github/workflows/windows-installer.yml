name: Render Dock Windows installer

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows-installer:
    runs-on: windows-latest
    steps:
      - name: Check out exact source
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Set up .NET 6
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 6.0.x

      - name: Test package contracts
        run: dotnet test "RenderDock.Tests/RenderDock.Tests.csproj" --configuration Release

      - name: Publish self-contained Windows x64 application
        shell: pwsh
        run: .\packaging\windows\publish.ps1

      - name: Build verified updater payload candidate
        shell: pwsh
        run: .\packaging\windows\build-updater-payload.ps1 -PublishDirectory '.\artifacts\publish\win-x64' -OutputDirectory '.\artifacts\installer'

      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup --no-progress --yes

      - name: Compile Windows installer
        shell: pwsh
        run: '& "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" "packaging/windows/render-dock.iss"'

      - name: Hash installer
        shell: pwsh
        run: |
          $installer = "artifacts/installer/Render-Dock-1.0.0-Windows-x64.exe"
          if (-not (Test-Path $installer)) { throw "Installer was not produced." }
          $hash = (Get-FileHash $installer -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  Render-Dock-1.0.0-Windows-x64.exe" | Set-Content "artifacts/installer/SHA256SUMS"
          "Render-Dock-1.0.0-Windows-x64.exe SHA-256 $hash" >> $env:GITHUB_STEP_SUMMARY

      - name: Verify updater payload metadata
        shell: pwsh
        run: |
          $metadata = Get-Content -LiteralPath 'artifacts/installer/Render-Dock-1.0.0-Windows-x64.update.json' -Raw | ConvertFrom-Json
          if ($metadata.schema -ne 'bke.update-package.v1' -or $metadata.productId -ne 'bke-render-dock' -or $metadata.entryPoint -ne 'RENDER DOCK.exe' -or $metadata.contentType -ne 'application/vnd.bke.update-package+zip') { throw 'Updater payload metadata contract invalid.' }

      - name: Upload installer and updater artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Render-Dock-1.0.0-Windows-x64
          path: |
            artifacts/installer/Render-Dock-1.0.0-Windows-x64.exe
            artifacts/installer/SHA256SUMS
            artifacts/installer/Render-Dock-1.0.0-Windows-x64.update.zip
            artifacts/installer/Render-Dock-1.0.0-Windows-x64.update.json
          if-no-files-found: error
