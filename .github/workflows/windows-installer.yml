name: Render Dock Windows x64 certification

on:
  issue_comment:
    types: [created]
  workflow_dispatch:
    inputs:
      source_sha:
        description: Exact current Render Dock PR head SHA
        required: true
        type: string
      pr_number:
        description: Current open Render Dock PR number
        required: true
        type: number

permissions:
  contents: read

jobs:
  plan:
    name: Resolve intentionally requested exact PR head
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.issue.pull_request &&
       github.event.comment.body == '/certify renderdock windows-x64')
    runs-on: ubuntu-latest
    outputs:
      source_sha: ${{ steps.intent.outputs.source_sha }}
      pr_number: ${{ steps.intent.outputs.pr_number }}
    steps:
      - name: Resolve current PR head and authorization
        id: intent
        uses: actions/github-script@v7
        env:
          DISPATCH_SHA: ${{ inputs.source_sha }}
          DISPATCH_PR: ${{ inputs.pr_number }}
        with:
          script: |
            const isComment = context.eventName === "issue_comment";
            if (isComment && !new Set(["OWNER","MEMBER","COLLABORATOR"])
                .has(context.payload.comment?.author_association ?? "NONE")) {
              core.setFailed("Only repository collaborators may request full Windows certification.");
              return;
            }
            const rawPr = isComment ? context.issue.number : Number(process.env.DISPATCH_PR);
            if (!Number.isSafeInteger(rawPr) || rawPr < 1) {
              core.setFailed("Exact open PR number is required."); return;
            }
            const response = await github.rest.pulls.get({
              owner: context.repo.owner, repo: context.repo.repo, pull_number: rawPr,
            });
            const pr = response.data;
            if (pr.state !== "open" || pr.base.ref !== "main" ||
                pr.head.repo?.full_name !== context.repo.owner + "/" + context.repo.repo ||
                !/^[0-9a-f]{40}$/i.test(pr.head.sha)) {
              core.setFailed("Certification requires an open same-repository main-based PR.");
              return;
            }
            if (!isComment && pr.head.sha !== process.env.DISPATCH_SHA) {
              core.setFailed("Manual SHA does not equal current PR head.");
              return;
            }
            core.setOutput("source_sha", pr.head.sha);
            core.setOutput("pr_number", String(rawPr));
            core.summary.addRaw(
              "Render Dock certification intent: Windows x64 full product + SDK + installer proof\n" +
              "Exact PR #" + rawPr + " SHA: " + pr.head.sha).write();

  windows-x64:
    name: Render Dock exact-head Windows x64 source/product/installer proof
    needs: plan
    if: needs.plan.result == 'success'
    runs-on: windows-latest
    env:
      SOURCE_SHA: ${{ needs.plan.outputs.source_sha }}
    steps:
      - name: Check out exact source
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.plan.outputs.source_sha }}
          persist-credentials: false

      - name: Verify checked-out exact candidate SHA
        shell: pwsh
        run: |
          if ((git rev-parse HEAD).Trim() -ne $env:SOURCE_SHA) { throw "Render Dock exact-head checkout mismatch" }

      - name: Set up .NET 10
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - name: Prepare pinned BKE SDK capabilities
        shell: pwsh
        run: |
          $project = Get-Content 'BKE_RENDER_DOCK/RENDER DOCK.csproj' -Raw
          if ($project -match 'PackageReference Include="BKE\.Desktop\.Licensing" Version="2\.0\.2"') {
            .\scripts\bootstrap-bke-sdk.ps1 -CertifyStartupGateClient
          } else {
            .\scripts\bootstrap-bke-sdk.ps1
          }
          if ($LASTEXITCODE -ne 0) { throw 'Pinned BKE SDK bootstrap or Windows contract proof failed' }

      - name: Verify product and capability boundaries
        shell: pwsh
        run: |
          $project = Get-Content "BKE_RENDER_DOCK/RENDER DOCK.csproj" -Raw
          $manifest = Get-Content "BKE_RENDER_DOCK/bke.manifest.json" -Raw | ConvertFrom-Json
          $program = Get-Content "BKE_RENDER_DOCK/Program.cs" -Raw
          $licensing = Get-Content "BKE_RENDER_DOCK/Licensing/AgentClient.cs" -Raw
          $notifications = Get-Content "BKE_RENDER_DOCK/Notifications/NotificationCoordinator.cs" -Raw
          $tray = Get-Content "BKE_RENDER_DOCK/Notifications/NotificationTrayController.cs" -Raw
          $updates = Get-Content "BKE_RENDER_DOCK/Updates/UpdateCoordinator.cs" -Raw
          $bootstrap = Get-Content "scripts/bootstrap-bke-sdk.ps1" -Raw
          $publish = Get-Content "packaging/windows/publish.ps1" -Raw
          $payload = Get-Content "packaging/windows/build-updater-payload.ps1" -Raw

          if ($project -notmatch '<TargetFramework>net10\.0-windows</TargetFramework>') { throw '.NET 10 Windows target missing' }
          if ($project -notmatch '<Version>1\.0\.3</Version>') { throw 'Project version is not 1.0.3' }
          if ($manifest.version -ne '1.0.3' -or $manifest.architecture -ne 'x64') { throw 'Canonical manifest must remain Render Dock 1.0.3 x64' }

          $sdkMatch = [regex]::Match($project, 'PackageReference Include="BKE\.Desktop\.Licensing" Version="(?<version>2\.0\.[12])"')
          if (!$sdkMatch.Success) { throw 'Uncertified BKE Desktop Licensing version' }
          $sdkVersion = $sdkMatch.Groups['version'].Value
          $approvedSdk = @{
            '2.0.1' = '8563d86976f65cd0cfcdd7e21c6c428c561e5dfe'
            '2.0.2' = 'e34431f5400aab00e87549b8aae8dedc3104f4bb'
          }
          if (-not $bootstrap.Contains($approvedSdk[$sdkVersion])) {
            throw 'BKE SDK version is not pinned to its certified immutable source'
          }
          if ($sdkVersion -eq '2.0.2' -and
              (-not $bootstrap.Contains('CertifyStartupGateClient') -or
               -not $project.Contains('BKE_STARTUP_GATE_CERTIFICATION') -or
               -not $program.Contains('AuthorizeConnectedProcessAsync'))) {
            throw 'Strict preproduction startup gate required with 2.0.2'
          }
          if ($project -notmatch 'PackageReference Include="BKE\.Notifications" Version="0\.5\.0"') { throw 'BKE Notifications 0.5.0 reference missing' }
          if ($project -notmatch 'PackageReference Include="BKE\.Updater" Version="0\.4\.0"') { throw 'BKE Updater 0.4.0 reference missing' }


          if ($program -match 'GracePeriodClient|graceActive|/api/graceperiod/renderdock' -or
              (Test-Path -LiteralPath 'BKE_RENDER_DOCK/Licensing/GracePeriodClient.cs')) {
            throw 'Unsigned remote grace startup authorization must be retired in all builds'
          }
          if ($program -notmatch 'EnsureAuthorizedAsync' -or $program -notmatch 'AuthorizationStatus\.Authorized') {
            throw 'Standalone licensing enforcement missing'
          }
          if ($licensing -notmatch 'BkeLicensingClient\.Create|EnsureAuthorizedAsync') { throw 'Canonical shared licensing flow missing' }
          if ($licensing -match 'OpenLicenseCenterAsync|AuthorizeAsync|HttpClient|127\.0\.0\.1:43873|/v1/authorize') { throw 'Product-owned licensing transport/recovery policy must remain absent' }

          if ($notifications -notmatch 'BkeNotificationInboxClient\.Create' -or $tray -notmatch 'BkeNotificationInboxClient\.Create') { throw 'Agent-backed notification capability missing' }
          if ($notifications -match 'HttpClient|127\.0\.0\.1:43873|/v1/notifications/' -or $tray -match 'HttpClient|127\.0\.0\.1:43873|/v1/notifications/') { throw 'Raw notification transport must remain absent' }
          if ($program -notmatch 'NotificationCoordinator\.ShowBeforeLicensing\(enterpriseSession\)' -or
              $program -notmatch 'NotificationTrayController\.Attach\(mainForm, enterpriseSession\)') { throw 'Notification composition missing' }

          if ($updates -notmatch 'BkeUpdaterClient\.Create|UpdateCheckStatus\.UpdateAvailable') { throw 'Canonical updater capability missing' }
          if ($updates -match 'HttpClient|127\.0\.0\.1:43873|/v1/updates|/v1/update-center/open') { throw 'Raw updater transport must remain absent' }

          if ($publish -notmatch 'win-x64') { throw 'win-x64 publish target missing' }
          if ($publish -match 'win-arm64') { throw 'Native ARM64 publish path must remain absent' }
          $payloadCompact = $payload -replace '\s',''
          if ($payloadCompact -notmatch "architecture='x64'") { throw 'x64 updater metadata contract missing' }

      - name: Test product contracts
        run: dotnet test "RenderDock.Tests/RenderDock.Tests.csproj" --configuration Release

      - name: Publish self-contained Windows x64 application
        shell: pwsh
        run: .\packaging\windows\publish.ps1

      - name: Verify SDK restore graph
        shell: pwsh
        run: |
          $assets = Get-Content "BKE_RENDER_DOCK/obj/project.assets.json" -Raw
          $project = Get-Content 'BKE_RENDER_DOCK/RENDER DOCK.csproj' -Raw
          $sdk = [regex]::Match($project, 'PackageReference Include="BKE\.Desktop\.Licensing" Version="(?<version>2\.0\.[12])"')
          if (!$sdk.Success) { throw 'Unapproved SDK version in restore graph' }
          $version = $sdk.Groups['version'].Value
          if (!$assets.Contains("BKE.Desktop.Licensing/$version")) {
            throw "Pinned BKE Desktop Licensing $version was not restored"
          }
          if ($assets -notmatch 'BKE\.Notifications/0\.5\.0') { throw 'BKE Notifications 0.5.0 was not restored' }
          if ($assets -notmatch 'BKE\.Updater/0\.4\.0') { throw 'BKE Updater 0.4.0 was not restored' }
          if ($assets -match 'BKE\.Desktop\.Client/1\.0\.0') { throw 'Legacy BKE Desktop Client must remain absent' }

      - name: Build and verify updater payload
        shell: pwsh
        run: |
          .\packaging\windows\build-updater-payload.ps1 -PublishDirectory '.\artifacts\publish\win-x64' -OutputDirectory '.\artifacts\installer'
          $metadataPath = 'artifacts/installer/Render-Dock-1.0.3-Windows-x64.update.json'
          $payloadPath = 'artifacts/installer/Render-Dock-1.0.3-Windows-x64.update.zip'
          $metadata = Get-Content -LiteralPath $metadataPath -Raw | ConvertFrom-Json
          $payload = Get-Item -LiteralPath $payloadPath
          $payloadHash = (Get-FileHash -LiteralPath $payloadPath -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($metadata.schema -ne 'bke.update-package.v1' -or
              $metadata.productId -ne 'bke-render-dock' -or
              $metadata.version -ne '1.0.3' -or
              $metadata.platform -ne 'windows' -or
              $metadata.architecture -ne 'x64' -or
              $metadata.entryPoint -ne 'RENDER DOCK.exe' -or
              $metadata.filename -ne 'Render-Dock-1.0.3-Windows-x64.update.zip' -or
              $metadata.contentType -ne 'application/vnd.bke.update-package+zip' -or
              $metadata.sha256 -ne $payloadHash -or
              [int64]$metadata.bytes -ne $payload.Length) {
            throw 'Render Dock x64 updater payload metadata contract invalid'
          }

      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup --no-progress --yes

      - name: Compile Windows x64 installer
        shell: pwsh
        run: '& "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" "packaging/windows/render-dock.iss"'

      - name: Hash certification artifacts
        shell: pwsh
        run: |
          $files = @(
            'artifacts/installer/Render-Dock-1.0.3-Windows-x64.exe',
            'artifacts/installer/Render-Dock-1.0.3-Windows-x64.update.zip',
            'artifacts/installer/Render-Dock-1.0.3-Windows-x64.update.json'
          )
          foreach ($file in $files) {
            if (-not (Test-Path -LiteralPath $file)) { throw "Certification artifact was not produced: $file" }
          }
          $lines = foreach ($file in $files) {
            $hash = (Get-FileHash -LiteralPath $file -Algorithm SHA256).Hash.ToLowerInvariant()
            $name = Split-Path -Leaf $file
            "$hash  $name"
          }
          $lines | Set-Content 'artifacts/installer/SHA256SUMS'
          $lines | ForEach-Object { "$_" >> $env:GITHUB_STEP_SUMMARY }

      - name: Certify NONSHIPPABLE Agent-first direct EXE startup fail-closed
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $project = Get-Content 'BKE_RENDER_DOCK/RENDER DOCK.csproj' -Raw
          if ($project -notmatch 'PackageReference Include="BKE\.Desktop\.Licensing" Version="2\.0\.2"') {
            Write-Host 'Legacy SDK: strict startup gate does not apply to this unmodified product.'
            exit 0
          }
          if (Test-Path -LiteralPath '\\.\pipe\bke-licensing-agent-standalone-startup-v1') {
            throw 'Disposable Windows runner unexpectedly has an installed Agent startup pipe.'
          }
          $output = Join-Path $env:RUNNER_TEMP 'renderdock-startup-gated-test-only'
          dotnet publish 'BKE_RENDER_DOCK/RENDER DOCK.csproj' --configuration Release -r win-x64 --self-contained false -p:BkeStartupGateCertification=true -o "$output"
          if ($LASTEXITCODE -ne 0) { throw 'Strict startup proof executable did not compile' }
          $exe = Join-Path $output 'RENDER DOCK.exe'
          if (!(Test-Path -LiteralPath $exe)) { throw 'Strict startup proof binary is missing' }
          $process = Start-Process -FilePath $exe -PassThru
          try {
            if (!$process.WaitForExit(20000)) {
              throw 'FAIL: Render Dock preproduction executable did not deny missing Agent before UI.'
            }
            if ($process.ExitCode -ne 84) {
              throw "FAIL: Render Dock expected Agent-denial exit 84, got $($process.ExitCode)"
            }
            Write-Host 'PASS: strict Render Dock direct EXE denied absent Agent before enterprise/commercial-key/UI.'
          }
          finally {
            if (!$process.HasExited) { $process.Kill() }
            $process.Dispose()
            Remove-Item -LiteralPath $output -Recurse -Force -ErrorAction SilentlyContinue
          }

      - name: Upload x64 certification evidence
        uses: actions/upload-artifact@v7
        with:
          name: Render-Dock-1.0.3-Windows-x64-certification
          path: |
            artifacts/installer/Render-Dock-1.0.3-Windows-x64.exe
            artifacts/installer/Render-Dock-1.0.3-Windows-x64.update.zip
            artifacts/installer/Render-Dock-1.0.3-Windows-x64.update.json
            artifacts/installer/SHA256SUMS
          if-no-files-found: error

  required-certification:
    name: Required certification
    if: always() && needs.plan.result == 'success'
    needs: [plan, windows-x64]
    runs-on: ubuntu-latest
    env:
      SOURCE_SHA: ${{ needs.plan.outputs.source_sha }}
      PR_NUMBER: ${{ needs.plan.outputs.pr_number }}
      WINDOWS_RESULT: ${{ needs.windows-x64.result }}
    steps:
      - name: Assert declared exact-head Windows proof
        shell: bash
        run: |
          if [ "$WINDOWS_RESULT" != 'success' ]; then
            echo "Required Render Dock certification failed for $SOURCE_SHA: windows-x64=$WINDOWS_RESULT"
            exit 1
          fi
          echo "Required certification PASS for $SOURCE_SHA: Render Dock PR #$PR_NUMBER windows-x64"
