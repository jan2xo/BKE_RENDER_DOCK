name: Windows installer

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows-installer:
    runs-on: windows-latest
    steps:
      - name: Check out exact source
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Set up .NET 6
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 6.0.x

      - name: Test product and Agent boundary
        run: dotnet test "RenderDock.Tests/RenderDock.Tests.csproj" --configuration Release

      - name: Publish self-contained Windows x64 application
        shell: pwsh
        run: >-
          dotnet publish "BKE_RENDER_DOCK/RENDER DOCK.csproj"
          --configuration Release
          --runtime win-x64
          --self-contained true
          --output "artifacts/publish/win-x64"

      - name: Smoke-test published executable and contract
        shell: pwsh
        run: |
          $smoke = Start-Process `
            -FilePath "artifacts/publish/win-x64/RENDER DOCK.exe" `
            -ArgumentList "--package-smoke" `
            -Wait `
            -PassThru
          if ($smoke.ExitCode -ne 0) { throw "Published package smoke failed." }
          $manifest = Get-Content "artifacts/publish/win-x64/bke.manifest.json" -Raw | ConvertFrom-Json
          if ($manifest.productId -ne "bke-render-dock" -or $manifest.version -ne "1.0.0" -or $manifest.entryPoint -ne "RENDER DOCK.exe") {
            throw "Published manifest is not canonical."
          }

      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup --no-progress -y

      - name: Compile Windows installer
        shell: pwsh
        run: '& "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" "packaging/windows/render-dock.iss"'

      - name: Hash installer
        shell: pwsh
        run: |
          $installer = "artifacts/installer/Render-Dock-1.0.0-Windows-x64.exe"
          if (-not (Test-Path $installer)) { throw "Installer was not produced." }
          $hash = (Get-FileHash $installer -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  Render-Dock-1.0.0-Windows-x64.exe" | Set-Content "artifacts/installer/SHA256SUMS"
          "installer_sha256=$hash" >> $env:GITHUB_OUTPUT
        id: installer_hash

      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: Render-Dock-1.0.0-Windows-x64
          path: |
            artifacts/installer/Render-Dock-1.0.0-Windows-x64.exe
            artifacts/installer/SHA256SUMS
          if-no-files-found: error
