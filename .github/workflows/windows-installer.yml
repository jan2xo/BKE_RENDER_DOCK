name: Render Dock Windows installer

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows-installer:
    runs-on: windows-latest
    steps:
      - name: Check out exact source
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Set up .NET 10
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - name: Prepare pinned BKE SDK capabilities
        shell: pwsh
        run: .\scripts\bootstrap-bke-sdk.ps1

      - name: Verify release version contract
        shell: pwsh
        run: |
          $project = Get-Content "BKE_RENDER_DOCK/RENDER DOCK.csproj" -Raw
          $manifest = Get-Content "BKE_RENDER_DOCK/bke.manifest.json" -Raw | ConvertFrom-Json
          $installer = Get-Content "packaging/windows/render-dock.iss" -Raw
          $payload = Get-Content "packaging/windows/build-updater-payload.ps1" -Raw
          if ($project -notmatch '<Version>1\.0\.2</Version>') { throw 'Project version is not 1.0.2.' }
          if ($manifest.version -ne '1.0.2') { throw 'Manifest version is not 1.0.2.' }
          if ($installer -notmatch '#define ProductVersion "1\.0\.2"') { throw 'Installer version is not 1.0.2.' }
          if (-not $payload.Contains("[string]`$Version = '1.0.2'")) { throw 'Updater payload version is not 1.0.2.' }

      - name: Verify canonical SDK capability boundaries
        shell: pwsh
        run: |
          $project = Get-Content "BKE_RENDER_DOCK/RENDER DOCK.csproj" -Raw
          $program = Get-Content "BKE_RENDER_DOCK/Program.cs" -Raw
          $licensing = Get-Content "BKE_RENDER_DOCK/Licensing/AgentClient.cs" -Raw
          $updates = Get-Content "BKE_RENDER_DOCK/Updates/UpdateCoordinator.cs" -Raw
          $bootstrap = Get-Content "scripts/bootstrap-bke-sdk.ps1" -Raw
          if ($project -notmatch '<TargetFramework>net10\.0-windows</TargetFramework>') { throw '.NET 10 Windows target missing' }
          if ($project -notmatch 'PackageReference Include="BKE\.Desktop\.Licensing" Version="2\.0\.1"') { throw 'BKE Desktop Licensing 2.0.1 reference missing' }
          if ($project -notmatch 'PackageReference Include="BKE\.Updater" Version="0\.4\.0"') { throw 'BKE Updater 0.4.0 reference missing' }
          if ($project -match 'PackageReference Include="BKE\.Desktop\.Client"') { throw 'Legacy BKE Desktop Client reference must remain removed' }
          if (-not $bootstrap.Contains('eb194d71f33e881fa34d50b3ba20743d51ad1b73')) { throw 'BKE SDK bootstrap is not pinned to the canonical recovery SDK commit.' }
          if ($licensing -notmatch 'BkeLicensingClient\.Create') { throw 'Desktop Licensing client missing' }
          if ($licensing -notmatch 'EnsureAuthorizedAsync') { throw 'Canonical licensing flow missing' }
          if ($licensing -match 'HttpClient|127\.0\.0\.1:43873|/v1/authorize|/v1/license-center/open') { throw 'Direct licensing transport must not return to Render Dock' }
          if ($updates -notmatch 'BkeUpdaterClient\.Create') { throw 'BKE Updater client missing' }
          if ($updates -notmatch 'UpdateCheckStatus\.UpdateAvailable') { throw 'Typed update result handling missing' }
          if ($updates -match 'HttpClient|127\.0\.0\.1:43873|/v1/updates|/v1/update-center/open') { throw 'Direct updater provider protocol must not return to Render Dock' }
          if (Test-Path 'BKE_RENDER_DOCK/Licensing/AgentUpdateClient.cs') { throw 'Legacy AgentUpdateClient must be removed.' }
          if (Test-Path 'BKE_RENDER_DOCK/Licensing/AgentUpdateCoordinator.cs') { throw 'Legacy AgentUpdateCoordinator must be removed.' }
          if (Test-Path 'BKE_RENDER_DOCK/Licensing/AuthorizationResult.cs') { throw 'Duplicate licensing result contract must be removed.' }
          if ($program -notmatch 'UpdateCoordinator\.Attach\(mainForm, enterpriseSession\)') { throw 'SDK update capability is not composed into Render Dock.' }

      - name: Test package contracts
        run: dotnet test "RenderDock.Tests/RenderDock.Tests.csproj" --configuration Release

      - name: Publish self-contained Windows x64 application
        shell: pwsh
        run: .\packaging\windows\publish.ps1

      - name: Verify SDK restore graph in product
        shell: pwsh
        run: |
          $assets = Get-Content "BKE_RENDER_DOCK/obj/project.assets.json" -Raw
          if ($assets -notmatch 'BKE\.Desktop\.Licensing/2\.0\.1') { throw 'BKE Desktop Licensing 2.0.1 was not restored into Render Dock.' }
          if ($assets -notmatch 'BKE\.Updater/0\.4\.0') { throw 'BKE Updater 0.4.0 was not restored into Render Dock.' }
          if ($assets -match 'BKE\.Desktop\.Client/1\.0\.0') { throw 'Legacy BKE Desktop Client must not remain in Render Dock restore graph.' }

      - name: Validate preserved-authority recovery certification
        shell: pwsh
        run: |
          $path = (Resolve-Path 'certification/windows_preserved_authority_recovery.ps1').Path
          $tokens = $null
          $errors = $null
          [void][System.Management.Automation.Language.Parser]::ParseFile($path, [ref]$tokens, [ref]$errors)
          if ($errors.Count -ne 0) {
            $errors | ForEach-Object { Write-Error $_.Message }
            throw 'Preserved-authority recovery certification script has PowerShell parse errors.'
          }
          $source = Get-Content -LiteralPath $path -Raw
          foreach ($required in @('InstallAndPrepare','Prepare','Exercise','Collect','unverifiable_signed_lease','lease_version_rejected')) {
            if (-not $source.Contains($required)) { throw "Recovery certification contract missing: $required" }
          }

          # Regression proof: invoke the script without -KitRoot. The probe must
          # reach Collect-mode evidence lookup instead of failing during Join-Path
          # because an automatic script-root variable resolved empty at parameter binding.
          $probeRoot = Join-Path $env:RUNNER_TEMP 'render-dock-recovery-kitroot-probe'
          Remove-Item -LiteralPath $probeRoot -Recurse -Force -ErrorAction SilentlyContinue
          $probeOutput = & powershell -NoProfile -ExecutionPolicy Bypass -File $path -Mode Collect -EvidenceRoot $probeRoot 2>&1
          $probeExit = $LASTEXITCODE
          # The child is expected to exit non-zero because no result.json exists.
          # Capture that result, then clear LASTEXITCODE so the GitHub pwsh wrapper
          # does not report the successful regression assertion itself as failure.
          $global:LASTEXITCODE = 0
          $probeText = ($probeOutput | Out-String)
          if ($probeExit -eq 0) { throw 'Recovery KitRoot probe unexpectedly succeeded without result evidence.' }
          if ($probeText -match 'Cannot bind argument to parameter .Path. because it is an empty string') {
            throw 'Recovery KitRoot default still resolves to an empty path.'
          }
          if ($probeText -notmatch 'No result found') {
            throw "Recovery KitRoot probe failed before expected Collect boundary: $probeText"
          }

      - name: Build verified updater payload candidate
        shell: pwsh
        run: .\packaging\windows\build-updater-payload.ps1 -PublishDirectory '.\artifacts\publish\win-x64' -OutputDirectory '.\artifacts\installer'

      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup --no-progress --yes

      - name: Compile Windows installer
        shell: pwsh
        run: '& "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" "packaging/windows/render-dock.iss"'

      - name: Hash release artifacts
        shell: pwsh
        run: |
          Copy-Item -LiteralPath "certification/windows_preserved_authority_recovery.ps1" -Destination "artifacts/installer/windows_preserved_authority_recovery.ps1" -Force
          $files = @(
            "artifacts/installer/Render-Dock-1.0.2-Windows-x64.exe",
            "artifacts/installer/Render-Dock-1.0.2-Windows-x64.update.zip",
            "artifacts/installer/Render-Dock-1.0.2-Windows-x64.update.json",
            "artifacts/installer/windows_preserved_authority_recovery.ps1"
          )
          foreach ($file in $files) {
            if (-not (Test-Path -LiteralPath $file)) { throw "Release artifact was not produced: $file" }
          }
          $lines = foreach ($file in $files) {
            $hash = (Get-FileHash -LiteralPath $file -Algorithm SHA256).Hash.ToLowerInvariant()
            $name = Split-Path -Leaf $file
            "$hash  $name"
          }
          $lines | Set-Content "artifacts/installer/SHA256SUMS"
          $lines | ForEach-Object { "$_" >> $env:GITHUB_STEP_SUMMARY }

      - name: Verify updater payload metadata
        shell: pwsh
        run: |
          $metadata = Get-Content -LiteralPath 'artifacts/installer/Render-Dock-1.0.2-Windows-x64.update.json' -Raw | ConvertFrom-Json
          if ($metadata.schema -ne 'bke.update-package.v1' -or
              $metadata.productId -ne 'bke-render-dock' -or
              $metadata.version -ne '1.0.2' -or
              $metadata.entryPoint -ne 'RENDER DOCK.exe' -or
              $metadata.contentType -ne 'application/vnd.bke.update-package+zip') {
            throw 'Updater payload metadata contract invalid.'
          }
          $payloadHash = (Get-FileHash -LiteralPath 'artifacts/installer/Render-Dock-1.0.2-Windows-x64.update.zip' -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($metadata.sha256 -ne $payloadHash) { throw 'Updater payload metadata hash does not match the updater ZIP.' }

      - name: Upload installer and updater artifacts
        uses: actions/upload-artifact@v7
        with:
          name: Render-Dock-1.0.2-Windows-x64
          path: |
            artifacts/installer/Render-Dock-1.0.2-Windows-x64.exe
            artifacts/installer/SHA256SUMS
            artifacts/installer/Render-Dock-1.0.2-Windows-x64.update.zip
            artifacts/installer/Render-Dock-1.0.2-Windows-x64.update.json
            artifacts/installer/windows_preserved_authority_recovery.ps1
          if-no-files-found: error

      - name: Publish GitHub release 1.0.2
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && startsWith(github.event.head_commit.message, 'Release Render Dock 1.0.2')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = 'v1.0.2'
          $repo = '${{ github.repository }}'
          gh release view $tag --repo $repo *> $null
          if ($LASTEXITCODE -eq 0) {
            Write-Host "Release $tag already exists; leaving existing release unchanged."
            exit 0
          }
          $notesPath = Join-Path $env:RUNNER_TEMP 'render-dock-1.0.2-release-notes.md'
          @'
          Render Dock 1.0.2

          Render Dock .NET 10 SDK-capability release. Licensing uses BKE.Desktop.Licensing 2.0.1 and update discovery uses BKE.Updater 0.4.0 through the trusted Licensing Agent provider boundary.

          Assets include the Windows installer, deterministic updater payload ZIP, updater metadata, and SHA-256 evidence.
          '@ | Set-Content -LiteralPath $notesPath
          gh release create $tag `
            --repo $repo `
            --target $env:GITHUB_SHA `
            --title 'Render Dock 1.0.2' `
            --notes-file $notesPath `
            'artifacts/installer/Render-Dock-1.0.2-Windows-x64.exe' `
            'artifacts/installer/Render-Dock-1.0.2-Windows-x64.update.zip' `
            'artifacts/installer/Render-Dock-1.0.2-Windows-x64.update.json' `
            'artifacts/installer/SHA256SUMS'
          if ($LASTEXITCODE -ne 0) { throw 'GitHub release publication failed.' }
