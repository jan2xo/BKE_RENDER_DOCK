name: Render Dock V2 fast validation

on:
  push:
    branches: [ v2 ]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: render-dock-v2-fast-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: windows-latest
    steps:
      - name: Check out exact source
        uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}

      - name: Set up .NET 10
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - name: Prepare pinned BKE SDK capabilities
        shell: pwsh
        run: .\scripts\bootstrap-bke-sdk.ps1

      - name: Verify migration invariants
        shell: pwsh
        run: |
          $project = Get-Content 'BKE_RENDER_DOCK/RENDER DOCK.csproj' -Raw
          $program = Get-Content 'BKE_RENDER_DOCK/Program.cs' -Raw
          $manifest = Get-Content 'BKE_RENDER_DOCK/bke.manifest.json' -Raw | ConvertFrom-Json

          if ($project -notmatch '<TargetFramework>net10\.0-windows</TargetFramework>') { throw '.NET 10 Windows target missing' }
          if ($project -notmatch '<Version>1\.0\.3</Version>') { throw 'Render Dock version lock moved' }
          if ($manifest.version -ne '1.0.3' -or $manifest.architecture -ne 'x64') { throw 'Canonical 1.0.3 x64 manifest changed' }
          if ($project -notmatch 'PackageReference Include="Avalonia" Version="12\.1\.3"') { throw 'Avalonia 12.1.3 reference missing' }
          if ($project -notmatch 'PackageReference Include="Avalonia\.Desktop" Version="12\.1\.3"') { throw 'Avalonia.Desktop 12.1.3 reference missing' }
          if ($project -notmatch 'PackageReference Include="Avalonia\.Themes\.Fluent" Version="12\.1\.3"') { throw 'Avalonia.Themes.Fluent 12.1.3 reference missing' }
          if ($program -notmatch 'Application\.Run\(mainForm\)') { throw 'WinForms startup must remain active at this checkpoint' }
          if ($program -match 'AppBuilder|StartWithClassicDesktopLifetime|Avalonia\.App') { throw 'Avalonia startup was activated before migration validation' }

      - name: Restore Render Dock
        run: dotnet restore "BKE_RENDER_DOCK/RENDER DOCK.csproj"

      - name: Build Render Dock
        run: dotnet build "BKE_RENDER_DOCK/RENDER DOCK.csproj" --configuration Release --no-restore

      - name: Test product contracts
        run: dotnet test "RenderDock.Tests/RenderDock.Tests.csproj" --configuration Release
