name: Render Dock PR Guard

# Cheap PR ledger validation ONLY. Full Windows suites are dispatched by
# /certify renderdock windows-x64 on an authorized PR comment.
on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read

jobs:
  guard:
    name: PR Guard (cheap)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - name: Check exact PR candidate SHA and source contract files
        shell: bash
        env:
          REQUIRED_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$REQUIRED_SHA"
          test -s "BKE_RENDER_DOCK/Program.cs"
          test -s "BKE_RENDER_DOCK/bke.manifest.json"
          test -s "RenderDock.Tests/PackageContractTests.cs"
          test -s "BKE_RENDER_DOCK/RENDER DOCK.csproj"
          echo "PASS PR Guard for exact Render Dock head $REQUIRED_SHA; heavy certification NOT requested."

      - name: Fail closed if heavy certification becomes PR/push automatic
        shell: bash
        run: |
          node <<'NODE'
          const fs = require("node:fs");
          const yaml = fs.readFileSync(".github/workflows/windows-installer.yml", "utf8");
          const trigger = yaml.split(/^on:\s*$/m)[1]?.split(/^permissions:\s*$/m)[0] ?? "";
          if (!trigger.includes("issue_comment:") || !trigger.includes("workflow_dispatch:") ||
              /^\s*(pull_request|push|release):/m.test(trigger)) {
            throw new Error("Heavy Render Dock CI must be explicitly requested.");
          }
          for (const invariant of [
            "github.event.comment.body == '/certify renderdock windows-x64'",
            "author_association", "source_sha", "pr.head.sha",
            "ref: ${{ needs.plan.outputs.source_sha }}",
            "Required certification", "if: always() && needs.plan.result == 'success'"
          ]) {
            if (!yaml.includes(invariant)) throw new Error("Missing CI trust invariant: " + invariant);
          }
          console.log("PASS: PR Guard validates explicit SHA-bound, gated heavy CI.");
          NODE
